name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PRE_COMMIT_PYTHON_VERSION: '3.10'
  TEST_PYTHON_VERSIONS: '["3.10", "3.11", "3.12"]'
  COVERAGE_PYTHON_VERSION: '3.10'

jobs:
  # Stage 1: Pre-commit checks (formatting, linting)
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    with:
      python-version: ${{ env.PRE_COMMIT_PYTHON_VERSION }}

  # Stage 2: CPU-only tests
  cpu-tests:
    needs: pre-commit
    uses: ./.github/workflows/cpu-tests.yml
    with:
      python-versions: ${{ env.TEST_PYTHON_VERSIONS }}

  # Stage 3: CUDA-enabled tests
  cuda-tests:
    needs: cpu-tests
    uses: ./.github/workflows/cuda-tests.yml
    with:
      python-versions: ${{ env.TEST_PYTHON_VERSIONS }}
      coverage-python-version: ${{ env.COVERAGE_PYTHON_VERSION }}
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  # Final check
  final-check:
    name: Build
    runs-on: ubuntu-latest
    needs: [cuda-tests]
    steps:
      - name: Success
        run: echo "All tests passed!"
