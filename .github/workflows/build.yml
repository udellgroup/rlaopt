name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Stage 1: Pre-commit checks (formatting, linting)
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml

  # Stage 2: CPU-only tests
  cpu-tests:
    needs: pre-commit
    uses: ./.github/workflows/cpu-tests.yml

  # Stage 3: CUDA-enabled tests
  cuda-tests:
    needs: cpu-tests
    uses: ./.github/workflows/cuda-tests.yml
    secrets: inherit  # Pass secrets to the reusable workflow for SonarQube

  # Final check
  final-check:
    name: Build
    runs-on: ubuntu-latest
    needs: [cuda-tests]
    steps:
      - name: Success
        run: echo "All tests passed!"
