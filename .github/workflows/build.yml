name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Stage 1: Pre-commit checks (formatting, linting)
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    with:
      python-version: '3.10'

  # Stage 2: CPU-only tests
  cpu-tests:
    needs: pre-commit
    uses: ./.github/workflows/cpu-tests.yml
    with:
      python-versions: '["3.10", "3.11", "3.12"]'

  # Stage 3: CUDA-enabled tests
  cuda-tests:
    needs: cpu-tests
    uses: ./.github/workflows/cuda-tests.yml
    with:
      python-versions: '["3.10", "3.11", "3.12"]'
      coverage-python-version: '3.10'
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  # Final check
  final-check:
    name: Build
    runs-on: ubuntu-latest
    needs: [cuda-tests]
    steps:
      - name: Success
        run: echo "All tests passed!"
