name: CPU Tests

on:
  workflow_call:
    inputs:
      python-versions:
        required: true
        type: string

jobs:
  cpu-tests:
    name: CPU-only Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync test environment
        run: uv sync --locked --no-default-groups --group test --python "${{ matrix.python-version }}"

      - name: Run CPU-only tests
        run: uv run --locked --no-sync pytest -x

  minimum-dependency-tests:
    name: Minimum Dependency Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync minimum direct dependencies
        run: >-
          uv sync --upgrade --resolution lowest-direct
          --no-default-groups --group test --python 3.10

      - name: Run tests with minimum direct dependencies
        run: uv run --no-sync pytest -x
