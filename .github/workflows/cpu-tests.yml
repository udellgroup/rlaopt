name: CPU Tests

on:
  workflow_call:
    inputs:
      python-versions:
        required: true
        type: string

jobs:
  cpu-tests:
    name: CPU-only Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync test environment
        run: uv sync --locked --no-default-groups --group test --python "${{ matrix.python-version }}"

      - name: Run CPU-only tests
        run: uv run --locked --no-sync pytest -x
