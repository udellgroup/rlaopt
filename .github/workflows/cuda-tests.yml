name: CUDA Tests

on:
  workflow_call:
    inputs:
      python-versions:
        required: true
        type: string
      coverage-python-version:
        required: true
        type: string
    secrets:
      sonar-token:
        required: true

jobs:
  cuda-tests:
    name: CUDA-enabled Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: '12.5.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'
          use-github-cache: 'true'

      - name: Verify CUDA
        run: nvcc --version

      # Coverage Python version with coverage for SonarQube
      - name: Sync test environment
        run: uv sync --locked --no-default-groups --group test --python "${{ matrix.python-version }}"

      - name: Run CUDA tests with coverage
        if: matrix.python-version == inputs.coverage-python-version
        run: uv run --locked --no-sync pytest -x --cov=rlaopt --cov-report=xml

      # Other Python versions without coverage
      - name: Run CUDA tests
        if: matrix.python-version != inputs.coverage-python-version
        run: uv run --locked --no-sync pytest -x

      # SonarQube Scan (only for coverage Python version)
      - name: SonarQube Scan
        if: matrix.python-version == inputs.coverage-python-version
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.sonar-token }}
