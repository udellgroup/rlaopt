name: CUDA Tests

on:
  workflow_call:
    inputs:
      python-versions:
        required: true
        type: string
      coverage-python-version:
        required: true
        type: string
      sonar-token:
        required: true
        type: string

jobs:
  cuda-tests:
    name: CUDA-enabled Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: '12.5.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'
          use-github-cache: 'true'

      - name: Verify CUDA
        run: nvcc --version

      # Coverage Python version with coverage for SonarQube
      - name: Install and test CUDA build with coverage
        if: matrix.python-version == inputs.coverage-python-version
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pytest -x --cov=rlaopt --cov-report=xml

      # Other Python versions without coverage
      - name: Install and test CUDA build
        if: matrix.python-version != inputs.coverage-python-version
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pytest -x

      # SonarQube Scan (only for coverage Python version)
      - name: SonarQube Scan
        if: matrix.python-version == inputs.coverage-python-version
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ inputs.sonar-token }}
