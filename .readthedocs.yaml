# Read the Docs configuration for Sphinx
# https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - pdf
  - epub

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
