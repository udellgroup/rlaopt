[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rlaopt*"]

[project]
name = "rlaopt"
version = "0.1.0"
description = "Randomized linear algebra-based methods for optimization and scientific computing in PyTorch."
keywords = ["optimization", "scientific computing", "linear algebra", "randomized algorithms", "PyTorch"]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Pratik Rathore", email = "pratikr@stanford.edu"},
    {name = "Zachary Frangella", email = "zfran@stanford.edu"},
    {name = "Parth Nobel", email = "ptnobel@stanford.edu"},
    {name = "Alexa Hu", email = "xuningh@stanford.edu"},
]
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.6.0",
    "torch_linops >= 0.2.0",
    "pandas>=2.0.0",
    "pydantic>=2.12.0",
    "tensordict>=0.10.0",
    "typing_extensions>=4.15.0",
]

[project.urls]
Homepage = "https://github.com/udellgroup/rlaopt"
Issues = "https://github.com/udellgroup/rlaopt/issues"

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
dev = [
    {include-group = "test"},
    "pre-commit>=4.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-book-theme>=1.0.0",
    "sphinxcontrib-bibtex>=2.6.0",
    "myst-parser>=2.0.0",
    "autodoc-pydantic>=2.0.0",
]

[tool.uv]
required-version = "==0.12.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle (docstring conventions)
]

[tool.ruff.lint.pydocstyle]
convention = "google"
